<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Academic Portal - Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #1a2a6c, #b21f1f, #fdbb2d);
            height: 100vh;
            display: flex; align-items: center; justify-content: center;
        }
        .login-card {
            background: rgba(255, 255, 255, 0.1);
            -webkit-backdrop-filter: blur(15px);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            padding: 40px;
            width: 400px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            text-align: center; color: white;
        }
        h2 { margin-bottom: 20px; font-weight: 600; letter-spacing: 1px; }
        input {
            width: 100%; padding: 12px; margin: 10px 0;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 10px; color: white; outline: none;
        }
        input::placeholder { color: rgba(255, 255, 255, 0.7); }
        button {
            width: 100%; padding: 12px; margin-top: 20px;
            background: #00f2fe; border: none; border-radius: 10px;
            font-weight: 600; cursor: pointer; transition: 0.3s;
        }
        button:hover { background: #4facfe; transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0, 242, 254, 0.4); }
        .error { color: #ff4b2b; font-size: 0.8em; margin-top: 10px; }
        .signup-link { color: #00f2fe; text-decoration: none; font-size: 0.9em; display: block; margin-top: 15px; }
    </style>
</head>
<body>
    <div class="login-card">
        <h2>Academic Portal</h2>
        <form method="POST">
            <input type="email" name="email" placeholder="Email" required>
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit">Login to Dashboard</button>
        </form>
        {% if error %} <p class="error">{{ error }}</p> {% endif %}
        
        <a href="/signup" class="signup-link">New student? Create an account</a>
    </div>
</body>
</html>
